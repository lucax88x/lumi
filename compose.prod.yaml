services:
  gateway:
    image: caddy:2@sha256:504a44d7d74bd2bc28a66afc4774912fc21223ca8a67734af1c54ab2f999b489
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LUMI_GATEWAY_PORT:-18081}:8080"
    volumes:
      - ./deploy/Caddyfile.prod:/etc/caddy/Caddyfile:ro
    depends_on:
      lumi:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8081/healthz]
      interval: 10s
      timeout: 3s
      retries: 5
    read_only: true
    tmpfs: [/data, /config]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    # The official Caddy executable carries this file capability; keep it in
    # the bounding set so Linux permits exec, even on our unprivileged port.
    cap_add: [NET_BIND_SERVICE]
  lumi:
    image: ${LUMI_IMAGE:?Supply the published image digest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LUMI_PORT:-18080}:8080"
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN}
      OIDC_ISSUER_URL: ${PUBLIC_ORIGIN}/keycloak/realms/lumi
      OIDC_INTERNAL_URL: http://keycloak:8080/keycloak/realms/lumi
      OIDC_CLIENT_ID: lumi
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?Run local setup or configure a secret}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      keycloak:
        condition: service_healthy
      keycloak-init:
        condition: service_completed_successfully
    volumes:
      - lumi-data:/data
    tmpfs:
      - /tmp:size=64m,mode=1777
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    stop_grace_period: 15s
volumes:
  lumi-data:
