name: lumi-local
services:
  keycloak:
    command: [start, --import-realm, --spi-theme--static-max-age=-1, --spi-theme--cache-themes=false, --spi-theme--cache-templates=false]
  keycloak-init:
    environment:
      SMTP_ENABLED: ${SMTP_ENABLED:-true}
  gateway:
    image: caddy:2@sha256:504a44d7d74bd2bc28a66afc4774912fc21223ca8a67734af1c54ab2f999b489
    ports:
      - "127.0.0.1:${LUMI_LOCAL_PORT:-15183}:80"
    volumes:
      - ./deploy/Caddyfile.local:/etc/caddy/Caddyfile:ro
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN}
    depends_on:
      keycloak:
        condition: service_healthy
  mailpit:
    image: axllent/mailpit:v1.27@sha256:e22dce5b36f93c77082e204a3942fb6b283b7896e057458400a4c88344c3df68
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-18025}:8025"
