name: Publish
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/check.yml

  publish:
    needs: checks
    if: github.repository == 'lucax88x/lumi' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: lumi-publish-main
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable release tag
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/lucax88x/lumi:run-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.source=https://github.com/lucax88x/lumi
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.run_id }}-${{ github.run_attempt }}
      - name: Record release digest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          python3 - <<'PY'
          import json, os, re
          digest = os.environ['IMAGE_DIGEST']
          assert re.fullmatch(r'sha256:[0-9a-f]{64}', digest)
          run_id = int(os.environ['GITHUB_RUN_ID'])
          attempt = int(os.environ['GITHUB_RUN_ATTEMPT'])
          release = dict(schema=1, repository='lucax88x/lumi',
                         release_id=f'{run_id}-{attempt}', run_id=run_id,
                         run_attempt=attempt, commit=os.environ['GITHUB_SHA'],
                         digest=digest, image='ghcr.io/lucax88x/lumi@' + digest)
          with open('release.json', 'w') as f:
              json.dump(release, f, separators=(',', ':'))
              f.write('\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: lumi-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: release.json
          if-no-files-found: error
          retention-days: 90
      - name: Promote the current main image for Watchtower
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/promote-image.py
